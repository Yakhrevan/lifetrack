name: Verify LifeTrack integration candidate
# Re-run candidate verification after Kotlin compile fixes.

on:
  push:
    branches:
      - feature/lifetrack-12h-integration
    paths:
      - .github/workflows/integrate-recent-commits.yml
      - app/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifetrack-verify-fixed-candidate
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated integration candidate
        uses: actions/checkout@v4
        with:
          ref: feature/lifetrack-12h-integration
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and verify chart-rich-ui ancestry
        run: |
          git fetch origin '+refs/heads/feature/chart-rich-ui:refs/remotes/origin/feature/chart-rich-ui'
          git merge-base --is-ancestor origin/feature/chart-rich-ui HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build, unit tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lifetrack-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report verification result
        if: always()
        run: echo "Verification completed on the isolated integration branch. Promotion to chart-rich-ui requires a separate explicit review."
