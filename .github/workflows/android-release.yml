name: Android signed release (manual, certificate-gated)

on:
  push:
    branches:
      - feature/lifetrack-v12-phase4b-release
  workflow_dispatch:
    inputs:
      expected_signer_sha256:
        description: 'SHA-256 certificate fingerprint of the EXISTING installable APK (64 hex digits)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gate signing on credentials and expected upgrade identity
        id: signing_gate
        env:
          STORE_B64: ${{ secrets.LIFETRACK_UPLOAD_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.LIFETRACK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFETRACK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LIFETRACK_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ inputs.expected_signer_sha256 || vars.LIFETRACK_EXPECTED_SIGNER_SHA256 }}
        shell: bash
        run: |
          if [[ -z "$STORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo 'No release signing secrets configured. Signed artifact intentionally skipped.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$EXPECTED_CERT" ]]; then
            echo 'No existing-signer fingerprint configured. Signed artifact intentionally skipped.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Invalid signer SHA-256 input.'; exit 1; }
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/lifetrack-release.jks"
          test -s "$RUNNER_TEMP/lifetrack-release.jks"
          echo "LIFETRACK_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/lifetrack-release.jks" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Test and build signed APK / AAB
        if: steps.signing_gate.outputs.ready == 'true'
        env:
          LIFETRACK_KEYSTORE_PASSWORD: ${{ secrets.LIFETRACK_KEYSTORE_PASSWORD }}
          LIFETRACK_KEY_ALIAS: ${{ secrets.LIFETRACK_KEY_ALIAS }}
          LIFETRACK_KEY_PASSWORD: ${{ secrets.LIFETRACK_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon
      - name: Verify release signing identity before publishing artifact
        if: steps.signing_gate.outputs.ready == 'true'
        shell: bash
        env:
          EXPECTED_CERT: ${{ inputs.expected_signer_sha256 || vars.LIFETRACK_EXPECTED_SIGNER_SHA256 }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ "$CERT" != "$(printf '%s' "$EXPECTED_CERT" | tr 'A-F' 'a-f')" ]]; then
            echo 'Signer certificate does not match the expected upgrade certificate; refusing to publish.'
            exit 1
          fi
          echo "Verified signing certificate fingerprint: $CERT"
      - uses: actions/upload-artifact@v4
        if: steps.signing_gate.outputs.ready == 'true'
        with:
          name: lifetrack-signed-release-verified
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/lifetrack-release.jks" ]]; then
            shred -u "$RUNNER_TEMP/lifetrack-release.jks" || rm -f "$RUNNER_TEMP/lifetrack-release.jks"
          fi
